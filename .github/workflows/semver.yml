---
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:

name: Versioning
permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}-${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  versioning:
    runs-on: ubuntu-22.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: calculate version
        id: calculate-version
        uses: bitshifted/git-auto-semver@c4e8f005e839f822325356f141939cf6c76b5701 # pin@v1
        with:
          create_tag: true
          initial_version: 0.0.1
          tag_prefix: v

      - name: Generate release notes
        id: release-notes
        uses: RedCrafter07/release-notes-action@31674bfa3a219e7c661fc0c5b7b3851c741b9965 # pin@v1.0.1
        with:
          tag-name: "v${{ steps.calculate-version.outputs.version-string }}"
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make bats curl shellcheck shfmt

      - name: Synchronize and verify build dependencies
        run: |
          make deps
          make deps-check

      - name: Validate release inputs and artifact flavors
        run: make check test

      - name: Build release artifacts
        run: |
          make clean
          make build VERSION="${{ steps.calculate-version.outputs.version-string }}"

      - name: Verify release checksums
        run: |
          cd dist
          sha256sum -c \
            bootstrap.dev.bash.sha256 \
            bootstrap.bash.sha256 \
            bootstrap.min.bash.sha256

      - name: Verify release artifacts are independent of build dependencies
        run: |
          rm -rf vendor
          dist/bootstrap.dev.bash --help >/dev/null
          dist/bootstrap.bash --help >/dev/null
          dist/bootstrap.min.bash --help >/dev/null

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # pin@v4.2.2
        with:
          subject-path: |
            dist/bootstrap.dev.bash
            dist/bootstrap.bash
            dist/bootstrap.min.bash
            dist/bootstrap.dev.bash.sha256
            dist/bootstrap.bash.sha256
            dist/bootstrap.min.bash.sha256

      - name: Create release
        id: create-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          name: "v${{ steps.calculate-version.outputs.version-string }}"
          body: "${{ steps.release-notes.outputs.release-notes }}"
          tag_name: "v${{ steps.calculate-version.outputs.version-string }}"
          draft: false
          prerelease: false
          files: |
            dist/bootstrap.dev.bash
            dist/bootstrap.bash
            dist/bootstrap.min.bash
            dist/bootstrap.dev.bash.sha256
            dist/bootstrap.bash.sha256
            dist/bootstrap.min.bash.sha256
