---
name: Test

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

# The workflow needs checks:write so the test reporter can publish a
# first-class GitHub Check Run with parsed Bats/JUnit results.
permissions:
  contents: read

jobs:
  test:
    name: Check and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make bats curl doxygen shellcheck shfmt

      - name: Verify build does not acquire dependencies
        run: |
          test ! -e vendor
          make build
          test ! -e vendor
          dist/bootstrap.bash --help >/dev/null

      - name: Synchronize and verify project dependencies
        run: |
          make deps
          make deps-check

      - name: Verify make all from fresh generated state
        run: |
          make distclean
          make all
          make deps-check

      - name: Verify dependency convergence and offline detection
        run: |
          printf '%s\n' 'tampered dependency bytes' >vendor/doxygen-bash.awk
          if make deps-check; then
            printf '%s\n' 'deps-check unexpectedly accepted tampered dependency bytes' >&2
            exit 1
          fi
          make deps
          make deps-check

      - name: Generate documentation from prepared dependencies
        run: |
          make docs
          make deps-check
          test -f doc/reference/index.html
          test -z "$(git status --short)"

      - name: Verify consumer artifact is independent of vendor state
        run: |
          rm -rf vendor
          dist/bootstrap.bash --help >/dev/null

      - name: Run static checks
        run: make check
        id: shellcheck
        continue-on-error: true

      - name: Run Bats tests
        id: bats
        continue-on-error: true
        run: make test-report

      - name: Publish Bats test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Bats tests
          path: test-results/*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: true

      - name: Fail if Bats failed
        if: steps.bats.outcome == 'failure'
        run: exit 1
